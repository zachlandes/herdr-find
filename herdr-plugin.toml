id = "zachlandes.find"
name = "Find"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Search what your open agents said: fuzzy, exact, or by meaning"
platforms = ["linux", "macos"]

# The search itself, in a popup over the pane you are in
[[panes]]
id = "search"
title = "Find"
placement = "popup"
width = "90%"
height = "85%"
command = ["sh", "bin/herdr-find-plugin"]

# Opens the search; bind a key to zachlandes.find.open (see the README)
[[actions]]
id = "open"
title = "Find in open agents"
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin zachlandes.find --entrypoint search"]
